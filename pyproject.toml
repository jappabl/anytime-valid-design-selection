[tool.poetry]
name = "eval-harness"
version = "0.1.0"
description = "Anytime-valid sequential evaluation for LLM failure rates"
authors = ["Research Team"]
readme = "README.md"
packages = [{include = "eval_harness", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24.0"
pandas = "^2.0.0"
pydantic = "^2.0.0"
click = "^8.1.0"
scipy = "^1.10.0"
jsonschema = "^4.17.0"
pyyaml = "^6.0"
sqlalchemy = "^2.0.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
tqdm = "^4.65.0"
google-generativeai = "^0.3.0"
groq = "^0.14.0"
openai = "^1.0.0"
sqlparse = "^0.4.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.0"
pytest-cov = "^4.1.0"
black = "^23.3.0"
ruff = "^0.0.270"
mypy = "^1.3.0"
ipython = "^8.14.0"
jupyter = "^1.0.0"

[tool.poetry.scripts]
eval-harness = "eval_harness.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
