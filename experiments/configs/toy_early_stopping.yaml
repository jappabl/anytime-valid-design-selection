# Toy model that demonstrates early stopping
# Higher failure rate (easier to estimate) + wider precision target

name: "toy_model_p0.20_early_stop"

sampler:
  type: "toy"
  model_id: "toy_p0.20"
  failure_probability: 0.20  # Higher p = easier to estimate

validator:
  type: "json_schema"

prompts:
  type: "json_schema"
  n_prompts: 100
  seed: 42
  complexity: "simple"

decoding:
  temperature: 0.7
  top_p: 1.0
  max_tokens: 512

stopping:
  precision_target: 0.05  # Wider target for faster stopping
  certification_threshold: null
  min_samples: 30
  max_samples: 1000

statistics:
  alpha: 0.05
  method: "betting"

seed: 42
