# Stratified Sequential Evaluation - GPT-4o-mini
# Proposed: balanced sampling across difficulty strata
# Expected: Avoids early-stopping bias, maintains time-uniform validity

name: "stratified_gpt4mini_stratified"

sampler:
  type: "openai"
  model_id: "gpt-4o-mini"
  api_key: ${OPENAI_API_KEY}

validator:
  type: "json_schema"

prompts:
  type: "stratified_json"
  prompts_per_stratum: 250  # 250 per stratum × 4 strata = 1000 total
  sampling_mode: "stratified"  # Balanced across strata
  seed: 42

decoding:
  temperature: 0.0
  max_tokens: 500
  top_p: 1.0

stopping:
  precision_target: 0.10  # Stop when width ≤ 0.10
  certification_threshold: null  # Disable certification (let it run to see failures)
  min_samples: 200  # Minimum samples before allowing stop
  max_samples: 1000  # Budget cap (will hit this for full coverage)

statistics:
  alpha: 0.05

seed: 42
