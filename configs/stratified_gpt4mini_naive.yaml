# Naive Sequential Evaluation - GPT-4o-mini
# Baseline: uniform sampling without stratification
# Expected: May exhibit early-stopping bias on easy streaks

name: "stratified_gpt4mini_naive"

sampler:
  type: "openai"
  model_id: "gpt-4o-mini"
  api_key: ${OPENAI_API_KEY}

validator:
  type: "json_schema"

prompts:
  type: "stratified_json"
  prompts_per_stratum: 250  # 250 per stratum × 4 strata = 1000 total
  sampling_mode: "naive"  # Uniform sampling (baseline)
  seed: 42

decoding:
  temperature: 0.0
  max_tokens: 500
  top_p: 1.0

stopping:
  precision_target: 0.10  # Stop when width ≤ 0.10
  certification_threshold: null  # Disable certification (let it run to see failures)
  min_samples: 200  # Minimum samples before allowing stop
  max_samples: 1000  # Budget cap (will hit this for full coverage)

statistics:
  alpha: 0.05

seed: 42
